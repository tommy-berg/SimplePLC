name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (static)
    runs-on: ${{ matrix.runner }}
    # Signed attestations: how each binary was built (SLSA provenance) and what is in it (SBOM)
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: armv7       # Raspberry Pi OS 32-bit; built under QEMU, slow but once per release
            runner: ubuntu-24.04
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch == 'armv7'
      # The Alpine release of the Dockerfile's toolchain, so the binaries and the image link the same
      # runtime. The SBOM is made in the same container: it names the musl and GCC packages linked.
      - name: Build in Alpine (musl, fully static)
        run: |
          alpine=$(sed -n 's/^FROM \(alpine:[^ ]*\) AS toolchain$/\1/p' Dockerfile)
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src -e GITHUB_REF_NAME "$alpine" sh -c '
            apk add --no-cache build-base cmake git python3 linux-headers file &&
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIMPLEPLC_STATIC=ON -DSIMPLEPLC_FETCH_OPEN62541=ON &&
            cmake --build build -j"$(nproc)" &&
            strip build/simpleplc &&
            file build/simpleplc | grep -q "statically linked" &&
            ./build/simpleplc --version &&
            python3 security/sbom.py generate --toolchain --version "$GITHUB_REF_NAME" -o build/sbom.cdx.json'
          cp build/simpleplc simpleplc-linux-${{ matrix.arch }}
          cp build/sbom.cdx.json simpleplc-linux-${{ matrix.arch }}.cdx.json
      - uses: actions/attest@v4
        with:
          subject-path: simpleplc-linux-${{ matrix.arch }}
      - uses: actions/attest@v4
        with:
          subject-path: simpleplc-linux-${{ matrix.arch }}
          sbom-path: simpleplc-linux-${{ matrix.arch }}.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: simpleplc-linux-${{ matrix.arch }}
          path: |
            simpleplc-linux-${{ matrix.arch }}
            simpleplc-linux-${{ matrix.arch }}.cdx.json

  publish:
    name: GitHub release
    needs: [linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum simpleplc-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Docker Hub: tommyhbe/simpleplc, signed in with the repository secrets DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN (an access token with read and write rights)
  docker:
    name: Container image
    needs: [linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # v2.1.0 is pushed as 2.1.0 and latest; a pre-release such as v2.1.0-rc1 only under its own tag
      - name: Tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="tommyhbe/simpleplc"
          list="${image}:${version}"
          [[ "$version" == *-* ]] || list="${list},${image}:latest"
          echo "list=${list}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.list }}
      # The image's SBOM comes from its own toolchain stage; provenance and SBOM are pushed to
      # Docker Hub next to the image
      - name: SBOM
        run: |
          docker build --load --target toolchain -t simpleplc-toolchain .   # --load: buildx's builder keeps images to itself
          docker run --rm -v "$PWD":/src -w /src -e GITHUB_REF_NAME simpleplc-toolchain \
            python3 security/sbom.py generate --image linux/amd64,linux/arm64,linux/arm/v7 --version "$GITHUB_REF_NAME" -o sbom.cdx.json
      - uses: actions/attest@v4
        with:
          subject-name: index.docker.io/tommyhbe/simpleplc
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@v4
        with:
          subject-name: index.docker.io/tommyhbe/simpleplc
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
