name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (static)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: armv7       # Raspberry Pi OS 32-bit; built under QEMU, slow but once per release
            runner: ubuntu-24.04
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch == 'armv7'
      - name: Build in Alpine (musl, fully static)
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src alpine:3.20 sh -c '
            apk add --no-cache build-base cmake git python3 linux-headers file &&
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIMPLEPLC_STATIC=ON -DSIMPLEPLC_FETCH_OPEN62541=ON &&
            cmake --build build -j"$(nproc)" &&
            strip build/simpleplc &&
            file build/simpleplc | grep -q "statically linked" &&
            ./build/simpleplc --version'
          cp build/simpleplc simpleplc-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: simpleplc-linux-${{ matrix.arch }}
          path: simpleplc-linux-${{ matrix.arch }}

  publish:
    name: GitHub release
    needs: [linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum simpleplc-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # Docker Hub: tommyhbe/simpleplc, signed in with the repository secrets DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN (an access token with read and write rights)
  docker:
    name: Container image
    needs: [linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # v2.1.0 is pushed as 2.1.0 and latest; a pre-release such as v2.1.0-rc1 only under its own tag
      - name: Tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="tommyhbe/simpleplc"
          list="${image}:${version}"
          [[ "$version" == *-* ]] || list="${list},${image}:latest"
          echo "list=${list}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.tags.outputs.list }}
